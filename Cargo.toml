[package]
name = "refaudit"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
description = "Audit downstream bioinformatics result stability across reference genomes"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/refaudit"
keywords = ["bioinformatics", "reproducibility", "genomics", "quality-control"]
categories = ["science", "command-line-utilities"]
exclude = [".github/"]

[dependencies]
clap = { version = "=4.5.47", features = ["derive"] }
csv = "1.3.1"
flate2 = "1.1.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"
